plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.dris.airpad'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dris.airpad'
        minSdk 28
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Fixed key so future updates install over the old app (no uninstall needed)
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
